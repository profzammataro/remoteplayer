<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Music Player - Notebook</title>
<style>
  body{background:#111;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
  #unlock{padding:20px 40px;font-size:1.2em;background:#2dd77f;color:#000;border:none;border-radius:10px;cursor:pointer}
  #status{font-size:1.4em;margin:14px}
  #track{font-size:1.3em;color:#7fd;margin-bottom:10px}
</style>
</head>
<body>
  <button id="unlock">▶️ Attiva Player</button>
  <div id="track">Nessun brano selezionato</div>
  <div id="status">In attesa...</div>
  <audio id="audio"></audio>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
// 🔧 INSERISCI QUI la config del progetto studyshare-3d5f9 (la trovi in Firebase Console > Impostazioni progetto)
const firebaseConfig = {
  apiKey: "AIzaSyBsB6MHZtZXk-1XTGuqJpROCGc9-KTy6pU",
  authDomain: "studyshare-3d5f9.firebaseapp.com",
  databaseURL: "https://studyshare-3d5f9-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "studyshare-3d5f9",
  storageBucket: "studyshare-3d5f9.firebasestorage.app",
  messagingSenderId: "801438647195",
  appId: "1:801438647195:web:4424458a5d1c238c05973e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ROOM = "salotto"; // 🔧 cambia nome se vuoi gestire più "stanze/postazioni"
const audio = document.getElementById('audio');
const trackEl = document.getElementById('track');
const statusEl = document.getElementById('status');
const unlockBtn = document.getElementById('unlock');

// I browser bloccano l'autoplay senza un'interazione utente: questo click
// una tantum "sblocca" l'audio per tutte le riproduzioni remote successive.
unlockBtn.onclick = () => {
  audio.play().catch(()=>{});
  audio.pause();
  unlockBtn.style.display = 'none';
  statusEl.textContent = "Pronto ✅ - in attesa di comandi";
};

// Segnala lo stato reale di riproduzione su Firebase, cosi il telecomando
// puo mostrare un feedback visivo affidabile (conferma che il player ha
// davvero ricevuto ed eseguito il comando, non solo che e stato inviato).
function reportState(state) {
  db.ref(`musicplayer/rooms/${ROOM}/status`).set({ state, ts: Date.now() });
}

db.ref(`musicplayer/rooms/${ROOM}/nowPlaying`).on('value', snap => {
  const data = snap.val();
  if (!data) return;
  trackEl.textContent = "🎵 " + (data.title || "Brano");
  statusEl.textContent = "Caricamento brano...";

  if (data.url) {
    // Playlist fissa: brano con URL pubblico già ospitato (GitHub Pages, ecc.)
    audio.src = data.url;
  } else if (data.data) {
    // Brano caricato dallo smartphone come base64 via RTDB (senza Storage)
    const byteChars = atob(data.data);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const blob = new Blob([new Uint8Array(byteNumbers)], { type: data.mime || 'audio/mpeg' });
    audio.src = URL.createObjectURL(blob);
  } else {
    return;
  }

  audio.play().then(() => {
    statusEl.textContent = "In riproduzione";
    reportState('playing');
  }).catch(() => statusEl.textContent = "⚠️ Clicca 'Attiva Player' prima");
});

db.ref(`musicplayer/rooms/${ROOM}/control`).on('value', snap => {
  const c = snap.val();
  if (!c) return;
  if (c.action === 'pause') {
    audio.pause(); statusEl.textContent = "In pausa"; reportState('paused');
  }
  if (c.action === 'play') {
    audio.play().then(() => reportState('playing')).catch(() => statusEl.textContent = "⚠️ Clicca 'Attiva Player' prima");
    statusEl.textContent = "In riproduzione";
  }
  if (c.action === 'stop') {
    audio.pause(); audio.currentTime = 0; statusEl.textContent = "Fermato"; reportState('stopped');
  }
  if (c.action === 'volume') { audio.volume = c.value; }
});
</script>
</body>
</html>
