<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telecomando Musica</title>
<style>
  body{background:#111;color:#eee;font-family:system-ui,sans-serif;padding:20px;max-width:480px;margin:auto}
  h2{color:#7fd}
  button{padding:14px;margin:6px 4px;border:none;border-radius:8px;font-size:1em;cursor:pointer;background:#2dd77f;color:#000}
  button.secondary{background:#333;color:#eee}
  .tabs{display:flex;margin-bottom:16px}
  .tab{flex:1;padding:10px;text-align:center;background:#222;cursor:pointer;border-radius:8px 8px 0 0}
  .tab.active{background:#2dd77f;color:#000}
  .panel{display:none}
  .panel.active{display:block}
  .track-item{padding:10px;background:#222;border-radius:8px;margin-bottom:6px;cursor:pointer}
  .track-item:hover{background:#333}
  input[type=range]{width:100%}
  #uploadStatus{margin-top:10px;color:#7fd}
  progress{width:100%}
</style>
</head>
<body>
<h2>🎚️ Telecomando Musica</h2>

<div class="tabs">
  <div class="tab active" data-tab="playlist">Playlist</div>
  <div class="tab" data-tab="upload">Carica nuovo brano</div>
</div>

<div class="panel active" id="playlist">
  <div id="trackList"></div>
</div>

<div class="panel" id="upload">
  <input type="file" id="fileInput" accept="audio/*">
  <div id="uploadStatus"></div>
  <progress id="progressBar" value="0" max="100" style="display:none"></progress>
</div>

<div style="margin-top:20px">
  <button id="playBtn">▶️ Play</button>
  <button id="pauseBtn" class="secondary">⏸️ Pausa</button>
  <button id="stopBtn" class="secondary">⏹️ Stop</button>
</div>
<div style="margin-top:10px">
  🔊 <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
// 🔧 STESSA config usata in player.html (basta Realtime Database, niente Storage/Blaze)
const firebaseConfig = {
  apiKey: "TUA_API_KEY",
  authDomain: "studyshare-3d5f9.firebaseapp.com",
  databaseURL: "https://studyshare-3d5f9-default-rtdb.firebaseio.com",
  projectId: "studyshare-3d5f9",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOM = "salotto"; // 🔧 stessa "stanza" di player.html

// 🔧 Playlist fissa: aggiungi qui i brani già presenti fisicamente sul notebook
// (percorso locale o hosting GitHub Pages) oppure già caricati su Storage.
const PLAYLIST = [
  { title: "Brano di prova 1", url: "https://tuosito.github.io/audio/brano1.mp3" },
  { title: "Brano di prova 2", url: "https://tuosito.github.io/audio/brano2.mp3" },
];

const trackListEl = document.getElementById('trackList');
PLAYLIST.forEach(t => {
  const div = document.createElement('div');
  div.className = 'track-item';
  div.textContent = "🎵 " + t.title;
  div.onclick = () => sendTrack(t.url, t.title);
  trackListEl.appendChild(div);
});

function sendTrack(url, title) {
  db.ref(`musicplayer/rooms/${ROOM}/nowPlaying`).set({ url, title, ts: Date.now() });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  };
});

// 🔧 Stesso pattern già usato per l'app catalogo foto: upload diretto su
// Cloudinary con preset "unsigned", poi si invia al notebook il link restituito.
const CLOUD_NAME = "dpjdgvydp";
const UPLOAD_PRESET = "remotesound";/ 🔧 creato in Impostazioni > Upload > Signing Mode: Unsigned

document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('uploadStatus');
  const bar = document.getElementById('progressBar');
  bar.style.display = 'block';
  bar.value = 0;
  statusEl.textContent = "Caricamento su Cloudinary...";

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', UPLOAD_PRESET);

  const xhr = new XMLHttpRequest();
  // resource_type "video" perché Cloudinary gestisce l'audio in quella categoria
  xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, true);

  xhr.upload.onprogress = (ev) => {
    if (ev.lengthComputable) bar.value = (ev.loaded / ev.total) * 100;
  };

  xhr.onload = () => {
    if (xhr.status >= 200 && xhr.status < 300) {
      const res = JSON.parse(xhr.responseText);
      sendTrack(res.secure_url, file.name);
      statusEl.textContent = "✅ Caricato e inviato al notebook";
    } else {
      statusEl.textContent = "❌ Errore upload: " + xhr.status;
    }
  };
  xhr.onerror = () => statusEl.textContent = "❌ Errore di rete durante l'upload";
  xhr.send(formData);
};

document.getElementById('playBtn').onclick  = () => db.ref(`musicplayer/rooms/${ROOM}/control`).set({action:'play', ts:Date.now()});
document.getElementById('pauseBtn').onclick = () => db.ref(`musicplayer/rooms/${ROOM}/control`).set({action:'pause', ts:Date.now()});
document.getElementById('stopBtn').onclick  = () => db.ref(`musicplayer/rooms/${ROOM}/control`).set({action:'stop', ts:Date.now()});
document.getElementById('volSlider').oninput = (e) => db.ref(`musicplayer/rooms/${ROOM}/control`).set({action:'volume', value: parseFloat(e.target.value), ts:Date.now()});
</script>
</body>
</html>
